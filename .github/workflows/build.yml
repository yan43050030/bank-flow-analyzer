name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Windows 构建 ──────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name "银行流水资金统计" --add-data "ui/themes;ui/themes" fund_analyzer.py

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path "dist/银行流水资金统计/*" -DestinationPath "银行流水资金统计-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: 银行流水资金统计-windows-x64.zip

  # ── macOS 构建 ────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name "银行流水资金统计" --add-data "ui/themes:ui/themes" fund_analyzer.py

      - name: Create DMG
        run: |
          hdiutil create -volname "银行流水资金统计" -srcfolder "dist/银行流水资金统计.app" -ov -format UDZO "银行流水资金统计-macos.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: 银行流水资金统计-macos.dmg

  # ── 发布 Release ─────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body: |
            银行流水资金统计工具 ${{ steps.version.outputs.VERSION }}

            详见 [CHANGELOG.md](./blob/main/CHANGELOG.md)

            ### 下载
            - **Windows**: `银行流水资金统计-windows-x64.zip`
            - **macOS**: `银行流水资金统计-macos.dmg`
          files: |
            银行流水资金统计-windows-x64.zip
            银行流水资金统计-macos.dmg
          draft: false
          prerelease: false
