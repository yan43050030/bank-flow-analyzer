name: Build and Release

# 推送到 main 后自动构建；若 version.py 的版本号对应的 tag 尚不存在，
# 则自动创建 Release（softprops/action-gh-release 会自动建 tag）。
# 普通提交（版本号未变）不会重复发版。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write          # 创建 Release / tag 必须

jobs:
  # ── 版本检查：决定本次是否要发版 ──────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号 (version.py 是唯一真相来源)
        id: ver
        run: |
          VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "检测到版本: $VERSION"

      - name: 检查该版本 tag 是否已存在
        id: check
        run: |
          if git ls-remote --exit-code --tags origin \
               "refs/tags/v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag v${{ steps.ver.outputs.version }} 已存在，跳过发版"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag v${{ steps.ver.outputs.version }} 不存在，将发版"
          fi

  # ── Windows 构建 ──────────────────────────────────
  build-windows:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name BankFlowAnalyzer --add-data "ui/themes;ui/themes" --hidden-import matplotlib.backends.backend_qtagg --exclude-module PyQt6 --exclude-module PyQt5 fund_analyzer.py

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path "dist/BankFlowAnalyzer/*" -DestinationPath BankFlowAnalyzer-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: BankFlowAnalyzer-windows-x64.zip

  # ── macOS 构建 ────────────────────────────────────
  build-macos:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name BankFlowAnalyzer --add-data "ui/themes:ui/themes" --hidden-import matplotlib.backends.backend_qtagg --exclude-module PyQt6 --exclude-module PyQt5 fund_analyzer.py

      - name: Create DMG
        run: |
          hdiutil create -volname BankFlowAnalyzer -srcfolder "dist/BankFlowAnalyzer.app" -ov -format UDZO BankFlowAnalyzer-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: BankFlowAnalyzer-macos.dmg

  # ── 发布 Release（自动建 tag）─────────────────────
  release:
    needs: [check, build-windows, build-macos]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: 从 CHANGELOG 提取本版本发布说明
        run: awk '/^## \[/{c++} c==1' CHANGELOG.md > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check.outputs.version }}   # tag 不存在会自动建
          name: v${{ needs.check.outputs.version }}
          body_path: release_notes.md
          files: |
            BankFlowAnalyzer-windows-x64.zip
            BankFlowAnalyzer-macos.dmg
          draft: false
          prerelease: false
