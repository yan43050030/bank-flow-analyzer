name: Build and Release

# 推送到 main 后自动构建；若 version.py 的版本号对应的 tag 尚不存在，
# 则自动创建 Release。直接通过 gh release 上传构建产物，
# 不经过 actions/upload-artifact（避开 artifact 存储配额）。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write          # 创建 Release / tag 必须

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # ── 版本检查：决定本次是否要发版 ──────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号 (version.py 是唯一真相来源)
        id: ver
        run: |
          VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "检测到版本: $VERSION"

      - name: 检查该版本 tag 是否已存在
        id: check
        run: |
          if git ls-remote --exit-code --tags origin \
               "refs/tags/v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag v${{ steps.ver.outputs.version }} 已存在，跳过发版"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag v${{ steps.ver.outputs.version }} 不存在，将发版"
          fi

  # ── 创建草稿 Release（先于构建执行，避免竞态）────
  create-release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft Release
        run: |
          VERSION="v${{ needs.check.outputs.version }}"
          # 仅创建空的 draft Release（不含文件），确保 tag 先就位
          gh release create "$VERSION" --draft --notes "" --target "$GITHUB_SHA" || \
            echo "Release 已存在，直接复用"
          echo "draft Release $VERSION 已就绪"

  # ── Windows 构建 ──────────────────────────────────
  build-windows:
    needs: create-release
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name BankFlowAnalyzer --add-data "ui/themes;ui/themes" --hidden-import matplotlib.backends.backend_qtagg --exclude-module PyQt6 --exclude-module PyQt5 fund_analyzer.py

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path "dist/BankFlowAnalyzer/*" -DestinationPath BankFlowAnalyzer-windows-x64.zip

      # 直接上传到已存在的 draft Release（跳过 upload-artifact，避免配额限制）
      - name: Upload to Release
        shell: bash
        run: |
          VERSION="v${{ needs.check.outputs.version }}"
          echo "上传 BankFlowAnalyzer-windows-x64.zip 到 $VERSION"
          gh release upload "$VERSION" BankFlowAnalyzer-windows-x64.zip --clobber

  # ── macOS 构建 ────────────────────────────────────
  build-macos:
    needs: create-release
    if: needs.check.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name BankFlowAnalyzer --add-data "ui/themes:ui/themes" --hidden-import matplotlib.backends.backend_qtagg --exclude-module PyQt6 --exclude-module PyQt5 fund_analyzer.py

      - name: Create DMG
        run: |
          hdiutil create -volname BankFlowAnalyzer -srcfolder "dist/BankFlowAnalyzer.app" -ov -format UDZO BankFlowAnalyzer-macos.dmg

      # 直接上传到已存在的 draft Release
      - name: Upload to Release
        run: |
          VERSION="v${{ needs.check.outputs.version }}"
          echo "上传 BankFlowAnalyzer-macos.dmg 到 $VERSION"
          gh release upload "$VERSION" BankFlowAnalyzer-macos.dmg --clobber

  # ── 发布 Release（从 draft 转为正式，写入发布说明）──
  release:
    needs: [create-release, build-windows, build-macos]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从 CHANGELOG 提取本版本发布说明
        run: awk '/^## \[/{c++} c==1' CHANGELOG.md > release_notes.md

      - name: Publish Release
        run: |
          VERSION="v${{ needs.check.outputs.version }}"
          # 查找 draft Release ID，编辑发布
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq \
            '.[] | select(.tag_name=="'"$VERSION"'" and .draft) | .id' | head -1)
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -X PATCH \
              -f draft=false \
              -F body="$(cat release_notes.md)" > /dev/null
            echo "Release $VERSION 已发布"
          else
            echo "错误：未找到 draft Release $VERSION"
            exit 1
          fi