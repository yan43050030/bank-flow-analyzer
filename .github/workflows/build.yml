name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Windows 构建 ──────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name BankFlowAnalyzer --add-data "ui/themes;ui/themes" --hidden-import matplotlib.backends.backend_qtagg --exclude-module PyQt6 --exclude-module PyQt5 fund_analyzer.py

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path "dist/BankFlowAnalyzer/*" -DestinationPath BankFlowAnalyzer-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: BankFlowAnalyzer-windows-x64.zip

  # ── macOS 构建 ────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name BankFlowAnalyzer --add-data "ui/themes:ui/themes" --hidden-import matplotlib.backends.backend_qtagg --exclude-module PyQt6 --exclude-module PyQt5 fund_analyzer.py

      - name: Create DMG
        run: |
          hdiutil create -volname BankFlowAnalyzer -srcfolder "dist/BankFlowAnalyzer.app" -ov -format UDZO BankFlowAnalyzer-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: BankFlowAnalyzer-macos.dmg

  # ── 发布 Release ─────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body: |
            银行流水资金统计工具 ${{ steps.version.outputs.VERSION }}

            ### v2.1.0 更新内容
            - PySide6 框架，模块化 UI 架构
            - 多卡分页展示 + 汇总对比表
            - 资金量分析：入/出校验 + 最小值法 + max(峰值,最小资金量)
            - 余额校验精确到分
            - 适配建设银行、黑龙江省农村信用社模板
            - 多 Sheet 自动识别，借贷标志自动解析

            详见 [CHANGELOG.md](./blob/main/CHANGELOG.md)

            ### 下载
            - **Windows**: `BankFlowAnalyzer-windows-x64.zip`
            - **macOS**: `BankFlowAnalyzer-macos.dmg`
          files: |
            BankFlowAnalyzer-windows-x64.zip
            BankFlowAnalyzer-macos.dmg
          draft: false
          prerelease: false
